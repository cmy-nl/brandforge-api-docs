<!DOCTYPE html>

  <title>API Reference — BrandForge Developer Docs</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="/assets/logo.svg" type="image/svg+xml" />

  <style>
    body { margin: 0; background: var(--muted); }
    .topbar { display: none !important; }

    /* SWAGGER WRAPPER */
    #swagger-ui { max-width: 1200px; margin: 0 auto; padding: 0 24px 60px; }
    .swagger-ui .info { margin: 32px 0 20px; }
    .swagger-ui .info .title { font-family: var(--font-sans) !important; font-size: 32px !important; font-weight: 700 !important; color: var(--foreground) !important; }
    .swagger-ui .info p { font-family: var(--font-sans); color: var(--muted-foreground); }
    .swagger-ui .scheme-container { background: var(--background); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 12px 16px; }
    .swagger-ui .btn.authorize { background: var(--accent) !important; color: var(--accent-foreground) !important; border-color: var(--accent) !important; font-family: var(--font-sans) !important; font-weight: 600 !important; border-radius: var(--radius-md) !important; }
    .swagger-ui .btn.authorize:hover { background: var(--accent-soft) !important; }
    .swagger-ui .btn.authorize svg { fill: var(--accent-foreground) !important; }
    .swagger-ui .opblock-tag { font-family: var(--font-sans) !important; font-size: 15px !important; font-weight: 600 !important; }
    .swagger-ui .opblock .opblock-summary-method { font-family: var(--font-sans) !important; border-radius: var(--radius-sm) !important; }
    .swagger-ui .opblock-summary-path { font-family: ui-monospace, "SF Mono", Consolas, monospace !important; }
    .swagger-ui select, .swagger-ui input { font-family: var(--font-sans) !important; }
    .swagger-ui .btn { font-family: var(--font-sans) !important; border-radius: var(--radius-md) !important; }
    .swagger-ui .execute-wrapper .btn.execute { background: var(--accent-strong) !important; border-color: var(--accent-strong) !important; color: #fff !important; font-weight: 600 !important; }
  </style>
</head>
<body>

<!--#include virtual="/partials/_nav.html" -->

  <div id="swagger-ui"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/swagger-ui/5.11.0/swagger-ui-bundle.min.js"></script>
  <script>
    const spec = {"openapi": "3.0.3", "info": {"title": "BrandForge Provisioning API", "version": "1.0.0", "description": "Billing-system-agnostic provisioning API. Any external billing platform\nintegrates against the same endpoints \u2014 there are no provider-specific ones.\n\nSend your own client / service / product identifiers and BrandForge handles\naccount provisioning, plan management, SSO, and usage reporting.\n\n**Authentication:** every request carries the reseller's API key as a Bearer\ntoken. All data is scoped to that reseller.\n"}, "servers": [{"url": "https://brandforge.software/api/godmode/v1", "description": "Production"}, {"url": "https://staging.brandforge.software/api/godmode/v1", "description": "Staging"}], "security": [{"ResellerApiKey": []}], "tags": [{"name": "Connection"}, {"name": "Catalog"}, {"name": "Account"}, {"name": "Plans"}, {"name": "Session"}, {"name": "Status"}], "paths": {"/provision/ping": {"get": {"tags": ["Connection"], "summary": "Test connection", "responses": {"200": {"description": "Service reachable", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Envelope"}}}}}}}, "/provision/packages": {"get": {"tags": ["Catalog"], "summary": "List this reseller's plans", "description": "Returns the reseller's packages. Use `slug` as `plan_code` in later calls.", "responses": {"200": {"description": "Package list", "content": {"application/json": {"schema": {"allOf": [{"$ref": "#/components/schemas/Envelope"}, {"type": "object", "properties": {"data": {"type": "array", "items": {"$ref": "#/components/schemas/Package"}}}}]}}}}}}}, "/provision/create": {"post": {"tags": ["Account"], "summary": "Provision a new account", "description": "Idempotent on email within a reseller. Send external ids to enable billing deep-links.", "requestBody": {"required": true, "content": {"application/json": {"schema": {"$ref": "#/components/schemas/CreateRequest"}}}}, "responses": {"201": {"description": "Account created", "content": {"application/json": {"schema": {"allOf": [{"$ref": "#/components/schemas/Envelope"}, {"type": "object", "properties": {"data": {"$ref": "#/components/schemas/Account"}}}]}}}}, "409": {"$ref": "#/components/responses/Conflict"}, "422": {"$ref": "#/components/responses/ValidationError"}}}}, "/provision/add_plan": {"post": {"tags": ["Plans"], "summary": "Add an additional plan", "description": "Additive \u2014 existing plans are kept. A customer may hold multiple plans; credits/limits sum across them.", "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["service_id", "plan_code"], "properties": {"service_id": {"type": "string", "format": "uuid"}, "plan_code": {"type": "string", "example": "brandforge-growth-xxxx"}, "product_id": {"type": "string", "description": "Your billing product id"}}}}}}, "responses": {"200": {"description": "Plan added", "content": {"application/json": {"schema": {"allOf": [{"$ref": "#/components/schemas/Envelope"}, {"type": "object", "properties": {"data": {"type": "object", "properties": {"service_id": {"type": "string"}, "status": {"type": "string", "example": "active"}, "added_plan": {"type": "string"}, "active_plans": {"type": "array", "items": {"type": "string"}}}}}}]}}}}}}}, "/provision/change_package": {"post": {"tags": ["Plans"], "summary": "Replace the plan (upgrade / downgrade)", "description": "Replaces the active plan. Credits/limits carry forward automatically.", "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["service_id", "plan_code"], "properties": {"service_id": {"type": "string", "format": "uuid"}, "plan_code": {"type": "string"}}}}}}, "responses": {"200": {"description": "Package changed", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Envelope"}}}}}}}, "/provision/suspend": {"post": {"tags": ["Account"], "summary": "Suspend the whole account", "requestBody": {"$ref": "#/components/requestBodies/ServiceId"}, "responses": {"200": {"$ref": "#/components/responses/Ok"}}}}, "/provision/unsuspend": {"post": {"tags": ["Account"], "summary": "Reactivate the whole account", "requestBody": {"$ref": "#/components/requestBodies/ServiceId"}, "responses": {"200": {"$ref": "#/components/responses/Ok"}}}}, "/provision/terminate": {"post": {"tags": ["Account"], "summary": "Cancel the whole account", "requestBody": {"$ref": "#/components/requestBodies/ServiceId"}, "responses": {"200": {"$ref": "#/components/responses/Ok"}}}}, "/provision/suspend_plan": {"post": {"tags": ["Plans"], "summary": "Suspend one plan (multi-plan account)", "requestBody": {"$ref": "#/components/requestBodies/ServiceIdPlan"}, "responses": {"200": {"$ref": "#/components/responses/PlanResult"}}}}, "/provision/unsuspend_plan": {"post": {"tags": ["Plans"], "summary": "Reactivate one plan", "requestBody": {"$ref": "#/components/requestBodies/ServiceIdPlan"}, "responses": {"200": {"$ref": "#/components/responses/PlanResult"}}}}, "/provision/terminate_plan": {"post": {"tags": ["Plans"], "summary": "Cancel one plan (others stay active)", "requestBody": {"$ref": "#/components/requestBodies/ServiceIdPlan"}, "responses": {"200": {"$ref": "#/components/responses/PlanResult"}}}}, "/provision/link_account": {"post": {"tags": ["Account"], "summary": "Set / update external billing ids", "description": "For existing accounts, or to refresh ids. Enables upgrade/downgrade deep-links.", "requestBody": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["service_id"], "properties": {"service_id": {"type": "string", "format": "uuid"}, "client_id": {"type": "string", "description": "Your billing client id"}, "service_id_external": {"type": "string", "description": "Your billing service id"}, "plan_code": {"type": "string"}, "product_id": {"type": "string", "description": "Your billing product id"}}}}}}, "responses": {"200": {"$ref": "#/components/responses/Ok"}}}}, "/provision/sso": {"post": {"tags": ["Session"], "summary": "Log the customer into BrandForge", "description": "Returns a short-lived login_url; open it and the customer lands authenticated.", "requestBody": {"$ref": "#/components/requestBodies/ServiceId"}, "responses": {"200": {"description": "SSO token issued", "content": {"application/json": {"schema": {"allOf": [{"$ref": "#/components/schemas/Envelope"}, {"type": "object", "properties": {"data": {"type": "object", "properties": {"token": {"type": "string"}, "login_url": {"type": "string", "format": "uri"}, "plans": {"type": "array", "items": {"$ref": "#/components/schemas/PlanEntry"}}}}}}]}}}}}}}, "/provision/status": {"get": {"tags": ["Status"], "summary": "Current plan, credits, and workspaces", "parameters": [{"in": "query", "name": "service_id", "required": true, "schema": {"type": "string", "format": "uuid"}}], "responses": {"200": {"description": "Status", "content": {"application/json": {"schema": {"allOf": [{"$ref": "#/components/schemas/Envelope"}, {"type": "object", "properties": {"data": {"$ref": "#/components/schemas/Status"}}}]}}}}}}}}, "components": {"securitySchemes": {"ResellerApiKey": {"type": "http", "scheme": "bearer", "description": "Per-reseller API key. Enforces tenant isolation."}}, "requestBodies": {"ServiceId": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["service_id"], "properties": {"service_id": {"type": "string", "format": "uuid"}}}}}}, "ServiceIdPlan": {"required": true, "content": {"application/json": {"schema": {"type": "object", "required": ["service_id", "plan_code"], "properties": {"service_id": {"type": "string", "format": "uuid"}, "plan_code": {"type": "string"}}}}}}}, "responses": {"Ok": {"description": "Success", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Envelope"}}}}, "PlanResult": {"description": "Per-plan result", "content": {"application/json": {"schema": {"allOf": [{"$ref": "#/components/schemas/Envelope"}, {"type": "object", "properties": {"data": {"type": "object", "properties": {"service_id": {"type": "string"}, "plan_code": {"type": "string"}, "status": {"type": "string"}, "active_plans": {"type": "array", "items": {"type": "string"}}}}}}]}}}}, "Conflict": {"description": "Email already used by another account", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}, "ValidationError": {"description": "Missing or invalid parameters", "content": {"application/json": {"schema": {"$ref": "#/components/schemas/Error"}}}}}, "schemas": {"Envelope": {"type": "object", "properties": {"success": {"type": "boolean", "example": true}, "message": {"type": "string"}, "data": {"type": "object"}}}, "Error": {"type": "object", "properties": {"success": {"type": "boolean", "example": false}, "error": {"type": "string"}}}, "Package": {"type": "object", "properties": {"id": {"type": "string"}, "name": {"type": "string", "example": "Solo Plan"}, "slug": {"type": "string", "example": "brandforge-solo-xxxx"}, "product_id": {"type": "string", "nullable": true}}}, "CreateRequest": {"type": "object", "required": ["email", "first_name", "plan_code"], "properties": {"email": {"type": "string", "format": "email"}, "first_name": {"type": "string"}, "last_name": {"type": "string"}, "company_name": {"type": "string"}, "plan_code": {"type": "string"}, "password": {"type": "string", "description": "Optional \u2014 omit to auto-generate"}, "domain": {"type": "string"}, "client_id": {"type": "string", "description": "Your billing client id"}, "service_id_external": {"type": "string", "description": "Your billing service id"}, "product_id": {"type": "string", "description": "Your billing product id"}}}, "Account": {"type": "object", "properties": {"service_id": {"type": "string", "format": "uuid"}, "email": {"type": "string"}, "company_name": {"type": "string"}, "status": {"type": "string", "example": "active"}, "plan_code": {"type": "string"}, "domain": {"type": "string", "nullable": true}}}, "PlanEntry": {"type": "object", "properties": {"id": {"type": "string"}, "plan_code": {"type": "string"}, "status": {"type": "string"}, "primary": {"type": "boolean"}, "credits": {"type": "integer"}, "max_workspaces": {"type": "integer"}}}, "Status": {"type": "object", "properties": {"package": {"type": "object", "properties": {"plan_code": {"type": "string"}, "max_workspaces": {"type": "integer"}}}, "credits": {"type": "object", "properties": {"allocated": {"type": "integer"}, "used": {"type": "integer"}, "remaining": {"type": "integer"}, "over_limit": {"type": "boolean"}, "period_end": {"type": "string", "format": "date"}}}, "workspaces": {"type": "object", "properties": {"total": {"type": "integer"}, "active": {"type": "integer"}, "list": {"type": "array", "items": {"type": "object", "properties": {"id": {"type": "string"}, "name": {"type": "string"}, "slug": {"type": "string"}}}}}}}}}}};
    window.ui = SwaggerUIBundle({
      spec: spec,
      dom_id: '#swagger-ui',
      deepLinking: true,
      presets: [SwaggerUIBundle.presets.apis],
      layout: "BaseLayout",
      docExpansion: "list",
      defaultModelsExpandDepth: 0
    });
  </script>
