server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Server-side includes power the shared nav (partials/_nav.html) so every
    # page renders the exact same header instead of a hand-copied one.
    ssi on;

    # Partials are include-only, never served directly.
    location ^~ /partials/ {
        internal;
    }

    # Root is served explicitly via try_files (not the `index` directive) so
    # it never triggers nginx's internal-redirect-to-/index.html — that would
    # re-enter location matching and loop against the redirect just below.
    location = / {
        try_files /index.html =404;
    }

    # Old filenames redirect permanently to the clean URLs below, so any
    # bookmarked/shared link (e.g. .../swagger.html) still resolves.
    location = /swagger.html { return 301 /provisioning-api; }
    location = /api-reference { return 301 /provisioning-api; }
    location = /api-reference.html { return 301 /provisioning-api; }
    location = /onboarding.html { return 301 /whmcs-onboarding; }
    location = /index.html { return 301 /; }
    location = /upmind.html { return 301 /upmind; }

    # Clean URLs: /provisioning-api -> provisioning-api.html, etc.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
